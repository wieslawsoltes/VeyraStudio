name: Refresh standalone distributions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/complete-source.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source
        run: node --test tests/core/*.test.mjs
      - name: Rebuild standalone distributions
        run: |
          node scripts/package-libraries.mjs
          mkdir -p standalone-packages
          cp releases/*.tgz standalone-packages/
      - name: Verify isolated package imports
        run: |
          for archive in releases/*.tgz; do
            target=$(mktemp -d)
            tar -xzf "$archive" -C "$target"
            node --input-type=module -e 'await import(process.argv[1]);' "file://$target/package/index.js"
            rm -rf "$target"
          done
      - name: Commit refreshed distributions without rewriting history
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standalone-packages/
          git diff --cached --quiet || git commit -m 'build: refresh standalone distributions with playback clock fix'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  publish:
    needs: package
    uses: ./.github/workflows/publish.yml
    with:
      source_ref: ${{ needs.package.outputs.source_sha }}
