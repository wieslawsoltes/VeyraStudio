name: Import recovered Veyra source
on:
  push:
    branches: [main]
    paths: ['.github/import/READY.json']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  restore:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore source and verify every file
        run: python3 .github/import/restore.py
      - name: Validate core, server and browser adapter
        run: node --test tests/core/*.test.mjs
      - name: Rebuild standalone distributions
        run: |
          node scripts/package-libraries.mjs
          mkdir -p standalone-packages
          cp releases/*.tgz standalone-packages/
      - id: commit
        name: Commit full source without rewriting history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat: import Veyra Studio editor, libraries, server and browser-local Pages edition'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  publish:
    needs: restore
    uses: ./.github/workflows/publish.yml
    with:
      source_ref: ${{ needs.restore.outputs.source_sha }}
